<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bassam ♥️ Fatima</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Paste the complete contents of your original invitation here */
  </style>
</head>

<body>

  <!-- Your original invitation content -->

  <section class="event-section">
    <div class="event-card">

      <div class="event-day">
        الثلاثاء
      </div>

      <strong>
        ٦ تشرين الأول ٢٠٢٦
      </strong>

      <br>

      <strong>٧:٠٠ مساءً</strong>

      <br><br>

      <div class="event-title">
        Lalaland
      </div>

      <div class="event-location">
        الصرفند
      </div>

    </div>
  </section>


  <!-- Countdown -->
  <section class="countdown-section">

    <div class="countdown">

      <div class="countdown-box">
        <span id="days">00</span>
        <small>يوم</small>
      </div>

      <div class="countdown-box">
        <span id="hours">00</span>
        <small>ساعة</small>
      </div>

      <div class="countdown-box">
        <span id="minutes">00</span>
        <small>دقيقة</small>
      </div>

      <div class="countdown-box">
        <span id="seconds">00</span>
        <small>ثانية</small>
      </div>

    </div>

  </section>


  <script>
    const weddingDate = new Date("2026-10-06T19:00:00+03:00").getTime();

    const countdown = setInterval(function () {

      const now = new Date().getTime();
      const distance = weddingDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );

      document.getElementById("days").innerText =
        String(days).padStart(2, "0");

      document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");

      if (distance < 0) {
        clearInterval(countdown);

        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
      }

    }, 1000);
  </script>

</body>
</html>
