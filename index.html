```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bassam ♥️ Fatima</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fffaf5, #f7eee5);
      color: #4a3428;
      font-family: "Amiri", serif;
      text-align: center;
    }

    .event-section {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .event-card {
      width: 100%;
      max-width: 600px;
      padding: 50px 30px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(130, 90, 60, 0.2);
      border-radius: 25px;
      box-shadow: 0 15px 40px rgba(80, 50, 30, 0.12);
    }

    .event-day {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .event-card strong {
      font-size: 22px;
      line-height: 2;
    }

    .event-title {
      margin-top: 20px;
      font-family: "Cormorant Garamond", serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .event-location {
      margin-top: 5px;
      font-size: 24px;
    }

    .countdown-section {
      padding: 30px 20px 60px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      direction: ltr;
    }

    .countdown-box {
      width: 100px;
      padding: 18px 10px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(80, 50, 30, 0.1);
    }

    .countdown-box span {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-size: 38px;
      font-weight: 700;
      color: #7b5140;
    }

    .countdown-box small {
      display: block;
      margin-top: 4px;
      font-family: "Amiri", serif;
      font-size: 16px;
      color: #6b5145;
    }

    @media (max-width: 500px) {
      .event-card {
        padding: 40px 20px;
      }

        font-size: 24px;
      }

      .event-card strong {
        font-size: 19px;

        font-size: 36px;

    }
  </style>
</head>

<body>

  <!-- Event Information -->
  <section class="event-section">
    <div class="event-card">

      <div class="event-day">
        الثلاثاء
      </div>

      <strong>
        ٦ تشرين الأول ٢٠٢٦
      </strong>

      <br>

      <strong>
        تبدأ الدعوة الساعة ٧:٠٠ مساءً
      </strong>

      <br><br>

      <div class="event-title">
        Lalaland
      </div>

      <div class="event-location">
        الصرفند
      </div>

    </div>
  </section>


  <!-- Countdown -->
  <section class="countdown-section">

    <div class="countdown">

      <div class="countdown-box">
        <span id="days">00</span>
        <small>يوم</small>
      </div>

      <div class="countdown-box">
        <span id="hours">00</span>
        <small>ساعة</small>
      </div>

      <div class="countdown-box">
        <span id="minutes">00</span>
        <small>دقيقة</small>
      </div>

      <div class="countdown-box">
        <span id="seconds">00</span>
        <small>ثانية</small>
      </div>

    </div>

  </section>


  <script>

    // Wedding date: 6 October 2026 at 7:00 PM
    const weddingDate =
      new Date("2026-10-06T19:00:00+03:00").getTime();

    const countdown = setInterval(function () {

      const now = new Date().getTime();

      const distance = weddingDate - now;

      const days = Math.floor(
        distance / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (distance % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (distance % (1000 * 60 * 60)) /
        (1000 * 60)
      );

      const seconds = Math.floor(
        (distance % (1000 * 60)) /
        1000
      );


      if (distance >= 0) {

        document.getElementById("days").innerText =
          String(days).padStart(2, "0");

        document.getElementById("hours").innerText =
          String(hours).padStart(2, "0");

        document.getElementById("minutes").innerText =
          String(minutes).padStart(2, "0");

        document.getElementById("seconds").innerText =
          String(seconds).padStart(2, "0");

      } else {

        clearInterval(countdown);

        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";

      }

    }, 1000);

  </script>

</body>
</html>
